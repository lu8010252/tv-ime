<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>电视输入</title>
<style>
:root{--bg1:#0a1020;--bg2:#141f3a;--card:#16213a;--line:#2a3a5c;--text:#eaf0fa;--dim:#93a3bc;--acc:#5cc8ff;--ok:#56d39a;--err:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
body{margin:0 auto;color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px 16px calc(28px + env(safe-area-inset-bottom));max-width:520px}
.head{display:flex;align-items:center;gap:12px;margin:2px 0 6px}
.logo{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,#5cc8ff,#8f7cff);box-shadow:0 6px 18px rgba(92,200,255,.28)}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.5px}
.sub{color:var(--dim);font-size:13px;line-height:1.55;margin:0 2px 16px}
.card{background:linear-gradient(180deg,rgba(157,180,224,.13),rgba(157,180,224,.05));border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
textarea{display:block;width:100%;height:124px;border-radius:14px;border:1.5px solid var(--line);background:rgba(8,14,28,.55);color:var(--text);font-size:18px;line-height:1.5;padding:12px 14px;resize:none;transition:border-color .15s,box-shadow .15s}
textarea::placeholder{color:#62738f}
textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(92,200,255,.18)}
.row{display:flex;gap:10px;margin-top:12px}
button{flex:1;border:1px solid var(--line);border-radius:14px;padding:14px 4px;font-size:16px;font-weight:600;font-family:inherit;background:var(--card);color:var(--text);transition:transform .08s,background .15s,box-shadow .15s}
button:active{transform:scale(.96);background:#223459}
button.p{background:linear-gradient(135deg,#5cc8ff,#3c93f0);color:#04222e;border:0;box-shadow:0 6px 16px rgba(60,147,240,.35)}
button.p:active{background:linear-gradient(135deg,#4bb6ec,#2f82de)}
.small button{font-size:14px;padding:12px 2px}
h2{font-size:13px;color:var(--dim);margin:2px 2px 10px;font-weight:600;letter-spacing:.5px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{padding:18px 0;font-size:20px;border-radius:16px}
#st{min-height:22px;margin:4px 4px 0;font-size:14px;color:var(--dim);word-break:break-all;text-align:center}
#st:empty{display:none}
#st.ok{color:var(--ok)}#st.err{color:var(--err)}
</style>
</head>
<body>
<div class="head"><div class="logo">📺</div><h1>电视输入</h1></div>
<div class="sub">先在电视上点开要输入的输入框，再在这里打字（支持中文），电视上实时同步；点「发送」确认。</div>
<div class="card">
<textarea id="t" placeholder="在这里输入文字" autofocus></textarea>
<div class="row">
<button class="p" onclick="sendText(false)">发送</button>
<button onclick="sendText(true)">发送并回车</button>
</div>
<div class="row small">
<button onclick="ime('del')">⌫ 删一个</button>
<button onclick="ime('clear')">清空电视输入框</button>
<button onclick="ime('enter')">⏎ 回车</button>
</div>
</div>
<div class="card">
<h2>方向键（发给电视上当前的应用）</h2>
<div class="pad">
<button onclick="key(4)">返回</button><button onclick="key(19)">▲</button><button onclick="key(66)">回车</button>
<button onclick="key(21)">◀</button><button class="p" onclick="key(23)">确定</button><button onclick="key(22)">▶</button>
<span></span><button onclick="key(20)">▼</button><span></span>
</div>
</div>
<div id="st"></div>
<script>
var K=new URLSearchParams(location.search).get('k')||'';
var st=document.getElementById('st'),t=document.getElementById('t');
function show(ok,m){st.className=ok?'ok':'err';st.textContent=m}
function call(path,body){
  if(!K){show(false,'缺少口令：请扫描电视上的二维码打开本页');return Promise.resolve()}
  var u=path+(path.indexOf('?')<0?'?':'&')+'k='+encodeURIComponent(K);
  return fetch(u,{method:'POST',body:body==null?'':body}).then(function(r){return r.json()}).then(function(j){
    show(j.ok,j.ok?(j.msg&&j.msg!=='ok'?j.msg:'已发送'):j.msg);return j
  }).catch(function(e){show(false,'连不上电视：'+e)})
}
var liveTimer=null,liveBusy=false,lastLive=null;
function live(){
  if(!K||liveBusy)return;
  var v=t.value;if(v===lastLive)return;
  liveBusy=true;lastLive=v;
  fetch('/api/live?k='+encodeURIComponent(K),{method:'POST',body:v}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)show(false,j.msg);else{st.className='ok';st.textContent='实时同步中…'}
  }).catch(function(){show(false,'连不上电视')}).then(function(){liveBusy=false;if(t.value!==lastLive)live()})
}
t.addEventListener('input',function(){clearTimeout(liveTimer);liveTimer=setTimeout(live,150)});
function sendText(enter){
  var v=t.value;if(!v){show(false,'先输入文字');return}
  call('/api/text',v).then(function(j){if(j&&j.ok){t.value='';lastLive=null;if(enter)ime('enter')}})
}
function ime(a){call('/api/ime?act='+a)}
function key(c){call('/api/key?code='+c)}
</script>
</body>
</html>
