name: build-apk

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK (debug-signed, shrunk)
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "error:|e: |What went wrong|Execution failed|Could not|> " build.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::$msg"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk tv-ime.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-ime-apk
          path: tv-ime.apk

      # 每次构建都重建 latest：Releases 里的发布时间就是最新一次
      - name: Remove old latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes || true

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            构建自提交 ${{ github.sha }}
            下载 tv-ime.apk，用 U 盘或 tv-adb 装到电视，然后在电视上启用并设为默认输入法。
          files: tv-ime.apk
